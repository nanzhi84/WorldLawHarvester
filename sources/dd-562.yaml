id: dd-562
adapter: web
scope: "美国联邦最高法院官网（supremecourt.gov）Slip Opinions 列表发现与判决书 PDF 原件有界采集"
entry_urls:
  - "https://www.supremecourt.gov/opinions/opinions.aspx"
allowed_hosts: ["www.supremecourt.gov"]
