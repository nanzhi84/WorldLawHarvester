metadata:
  source_name: "美国联邦最高法院官网（supremecourt.gov）与 Caselaw Access Project (CAP)"
  document_type: "案例"
  language: "en"
  jurisdiction: "US"
documents:
  detail_url_patterns: ['^https://www\.supremecourt\.gov/opinions/\d+pdf/(?!\d+us|.*_diff_)\d+[a-z0-9-]+_[^/?#]+\.pdf$']
  detail_body: always
  fields:
