    document_number: {regex: 'No\.\s*([0-9A-Za-z\u2013-]+?)\.?(?:\s|$)'}
    issuer: {value: "Supreme Court of the United States"}
    published_at: {regex: '(?:Decided|\[)\s*([A-Za-z]+\s+\d{1,2},\s+\d{4})'}
