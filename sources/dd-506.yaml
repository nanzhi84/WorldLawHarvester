# 来源台账：docs/runbooks/source-adaptation-matrix.md#dd-506
id: dd-506
adapter: web
scope: "香港司法机构法律参考资料系统（LRS）判案书目录与全文有界采集"
entry_urls: ["https://legalref.judiciary.hk/lrs/common/ju/judgment.jsp", "https://legalref.judiciary.hk/lrs/common/ju/tjpv.jsp"]
allowed_hosts: ["legalref.judiciary.hk"]
allowed_path_prefixes: ["/lrs/common/ju/"]
archive_approved: true
robots: false
delay: 0.5
concurrency: 1
fetch: {mode: http, max_depth: 2, retries: 2, page_timeout_ms: 60000}
budget: {requests: 50, documents: 10, seconds: 300, response_bytes: 67108864}
metadata:
  source_name: "香港司法机构法律参考资料系统（LRS）"
  document_type: "案例"
  language: "en"
  jurisdiction: "HK"
documents:
  detail_url_patterns: ['^https://legalref\.judiciary\.hk/lrs/common/ju/ju_body\.jsp\?DIS=\d+']
  detail_body: always
  content_xpath: '//form[@name="search_body"]/table/tr/td/*'
  fields:
    title: {xpath: '//title'}
    document_number: {xpath: '//body', regex: '(\[\d{4}\]\s+HK[A-Z]+\s+\d+|[A-Z]{2,6}\s*\d+[A-Z]*/\d{4})'}
    issuer: {value: "High Court of the Hong Kong Special Administrative Region"}
    published_at: {xpath: '//body', regex: '(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}|\d{1,2}/\d{1,2}/\d{4})'}
