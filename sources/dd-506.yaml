  content_xpath: '//form[@name="search_body"]/table/tr/td/*'
  fields:
    title: {xpath: '//title'}
    document_number: {xpath: '(//p[contains(text(), "[") or contains(text(), "/")])[1]'}
    issuer: {value: "High Court of the Hong Kong Special Administrative Region"}
    published_at: {xpath: '//body', regex: 'on\s+(\d{1,2}/\d{1,2}/\d{4})'}
