# 来源台账：docs/runbooks/source-adaptation-matrix.md#dd-572
id: dd-572
adapter: web
scope: "非洲开放法律联盟（Kenya Law / Laws.Africa AKN 门户）成文法目录发现与全文有界采集"
entry_urls: ["https://new.kenyalaw.org/legislation/"]
allowed_hosts: ["new.kenyalaw.org"]
allowed_path_prefixes: ["/legislation/", "/akn/ke/act/"]
archive_approved: true
robots: false
delay: 0.5
fetch: {mode: http, max_depth: 1, retries: 2, page_timeout_ms: 60000}
budget: {requests: 50, documents: 10, seconds: 300, response_bytes: 67108864}
metadata:
  source_name: "Laws.Africa Commons & 非洲各国 LII 联盟（SouthLII / Kenya Law / TanzLII 等）"
  document_type: "法律法规"
  language: "en"
  jurisdiction: "KE"
documents:
  detail_url_patterns: ['^https://new\.kenyalaw\.org/akn/ke/act/(?:[a-z]+/)?\d+/\d+/eng@[\d-]+$']
  detail_body: always
  content_xpath: '//div[contains(@class, "akn-akomaNtoso")] | //main'
  fields:
    title: {xpath: '(//h1)[1]'}
    document_number: {xpath: '(//h2)[1]'}
    issuer: {value: "National Council for Law Reporting (Kenya Law)"}
    published_at: {xpath: '//dl', regex: 'Date\s+(\d{1,2}\s+[A-Za-z]+\s+\d{4})'}
