# 来源台账：docs/runbooks/source-adaptation-matrix.md#dd-549
id: dd-549
adapter: web
scope: "英国税务海关总署内部手册（HMRC Internal Manuals）集合目录发现与手册章节详情有界采集"
entry_urls:
  - "https://www.gov.uk/hmrc-internal-manuals/admin-law-manual/adml3000"
  - "https://www.gov.uk/hmrc-internal-manuals/appeals-reviews-and-tribunals-guidance/artg2120"
allowed_hosts: ["www.gov.uk", "assets.publishing.service.gov.uk"]
allowed_path_prefixes: ["/hmrc-internal-manuals/", "/media/"]
host_path_scopes:
  www.gov.uk: ["/hmrc-internal-manuals/"]
  assets.publishing.service.gov.uk: ["/media/"]
archive_approved: true
robots: false
delay: 0.5
fetch: {max_depth: 1, retries: 2}
budget: {requests: 50, documents: 10, seconds: 300, response_bytes: 67108864}
metadata:
  source_name: "英国税务海关总署内部手册（HMRC Internal Manuals）与税务裁判所判决"
  document_type: "税务资料"
  language: "en"
  jurisdiction: "GB"
documents:
  # 排除章节目录页 *000，以及作为入口的目录页 artg2120
  detail_url_patterns: ['^https://www\.gov\.uk/hmrc-internal-manuals/[^/]+/[a-z]{2,10}(?!\d*000$|.*2120$)\d{4,5}$']
  detail_body: always
  content_xpath: '//main[@id="content"]'
  fields:
    title: {xpath: '(//h1)[last()]'}
    document_number: {xpath: '(//h1)[last()]', regex: '^([A-Z]{2,10}\d+[A-Z0-9-]*)'}
    issuer: {xpath: '//dt[contains(.,"From:")]/following-sibling::dd[1]'}
    published_at: {xpath: '//dt[contains(.,"Published")]/following-sibling::dd[1]'}
