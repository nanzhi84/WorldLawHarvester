# 来源台账：docs/runbooks/source-adaptation-matrix.md#dd-502
id: dd-502
adapter: web
scope: "中国政府网国务院政策文件库首页最新行政法规与政策文件最小切片"
entry_urls: ["https://www.gov.cn/zhengce/index.htm"]
allowed_hosts: ["www.gov.cn"]
allowed_path_prefixes: ["/zhengce/"]
archive_approved: true
robots: true
delay: 0.5
fetch: {max_depth: 1, retries: 2}
budget: {requests: 12, documents: 1, seconds: 120, response_bytes: 33554432}
metadata:
  source_name: "国家规章库"
  document_type: "法律法规"
  language: "zh"
  jurisdiction: "CN"
  # priority: P1
documents:
  detail_url_patterns: ['^https://www\.gov\.cn/zhengce/content/\d{6}/content_\d+\.htm$']
  detail_body: always
  content_xpath: '//div[@id="UCAP-CONTENT"]|//table[contains(@class,"xxgk-table")]'
  fields:
    title: {xpath: '//tr[td[contains(.,"标") and contains(.,"题：")]]/td[2]|//title[not(//td[contains(.,"标") and contains(.,"题：")])]'}
    document_number: {xpath: '//tr[td[contains(.,"发文字号：")]]/td[2]'}
    issuer: {xpath: '//td[contains(.,"发文机关：")]/following-sibling::td[1]'}
    published_at: {xpath: '//td[contains(.,"成文日期：")]/following-sibling::td[1]|//meta[@name="firstpublishedtime" and not(//td[contains(.,"成文日期：")])]/@content'}
