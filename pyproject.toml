[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wlh"
version = "0.1.0"
description = "Controlled public legal document acquisition and immutable archives"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12", "boto3>=1.36", "lxml>=5", "openpyxl>=3.1", "pillow>=11",
  "playwright>=1.50", "procrastinate[psycopg]>=3", "psycopg[binary]>=3.2",
  "pydantic>=2.10", "pymupdf>=1.25,<2", "python-docx>=1.1", "pyyaml>=6",
  "rich>=13", "cryptography>=44", "protego>=0.4", "scrapy>=2.12", "selectolax>=0.3", "striprtf>=0.0.29", "xlrd>=2",
]

[project.scripts]
wlh = "wlh.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wlh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src/wlh"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
